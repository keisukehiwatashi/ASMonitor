name: Apple Inventory Checker
on:
  schedule:
    - cron: '*/10 * * * *' # 10分ごとに実行
  workflow_dispatch:      # 手動で実行するボタンを作る

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python monitor.py
